<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live - {{ username }}</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="p-6">
  <h1 class="text-2xl font-bold mb-4">Live: {{ username }}</h1>
  {% if is_owner %}
    <div class="flex gap-2">
      <button id="startBtn" type="button" class="px-4 py-2 bg-green-600 text-white rounded">Start Broadcast</button>
      <button id="stopBtn" type="button" class="px-4 py-2 bg-red-600 text-white rounded hidden">Stop Broadcast</button>
      <button id="muteBtn" type="button" class="px-4 py-2 bg-slate-700 text-white rounded" aria-pressed="false" disabled onclick="toggleAudioMute()">Mute Mic</button>
    </div>
    <p class="mt-4">Local preview:</p>
    <video id="localVideo" class="stream-player" autoplay muted playsinline style="width:640px; height:auto; background:#000"></video>
  {% else %}
    <div class="flex gap-2 items-center mb-4">
      <p>Watching: {{ username }}</p>
      {% if not embed_url %}
        <button id="muteBtn" type="button" class="px-4 py-2 bg-slate-700 text-white rounded text-sm" aria-pressed="false" onclick="toggleAudioMute()">Mute Audio</button>
      {% endif %}
    </div>
    <video id="remoteVideo" class="stream-player" autoplay playsinline controls style="width:640px; height:auto; background:#000"></video>
  {% endif %}

  {% if embed_url %}
    <div class="mt-6">
      <p class="text-sm text-slate-400">Embedded livestream:</p>
      <div class="stream-frame" style="position:relative;padding-top:56.25%;">
        <iframe src="{{ embed_url }}" style="position:absolute;left:0;top:0;width:100%;height:100%;border:0;" allowfullscreen allow="autoplay; encrypted-media"></iframe>
      </div>
    </div>
  {% endif %}

  {% if not is_owner %}
    <section class="mt-6 rounded-2xl border border-slate-800 bg-slate-900/70 p-5">
      <button id="giftBtn" type="button" class="rounded-full bg-amber-400 px-5 py-3 font-semibold text-slate-950 transition hover:bg-amber-300">
        Send a gift
      </button>
      <form id="giftForm" data-room="{{ username }}" class="mt-4 hidden max-w-md space-y-3">
        <label class="block text-sm text-slate-300" for="giftAmount">Gift amount (NGN)</label>
        <input id="giftAmount" name="amount" type="number" min="1" step="0.01" value="100" required
          class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-slate-100">
        <label class="block text-sm text-slate-300" for="giftEmail">Receipt email</label>
        <input id="giftEmail" name="email" type="email" value="{{ current_user.email if current_user.is_authenticated else '' }}" required
          class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-slate-100" placeholder="you@example.com">
        <button type="submit" class="rounded-full bg-cyan-500 px-5 py-3 font-semibold text-slate-950 transition hover:bg-cyan-400">
          Continue to secure checkout
        </button>
      </form>
      <p id="giftMessage" class="mt-3 text-sm text-slate-300" role="status" aria-live="polite"></p>
    </section>
  {% endif %}
  <div id="giftFeed" class="gift-feed" aria-live="polite" aria-atomic="false"></div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    const username = {{ (username|tojson) }};
    const isOwner = {{ 'true' if is_owner else 'false' }};
    const socket = io();
    window.liveSocket = socket;

    const pcs = {}; // peer connections indexed by remote socket id
    const configuration = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    let globalLocalStream = null; // Track local stream globally for muting

    let isMuted = false;
    function updateMuteButton() {
      const muteBtn = document.getElementById('muteBtn');
      if (!muteBtn) return;

      if (isOwner) {
        const audioTracks = globalLocalStream ? globalLocalStream.getAudioTracks() : [];
        muteBtn.disabled = audioTracks.length === 0;
        muteBtn.textContent = isMuted ? 'Unmute Mic' : 'Mute Mic';
        muteBtn.className = isMuted
          ? 'px-4 py-2 bg-red-600 text-white rounded'
          : 'px-4 py-2 bg-slate-700 text-white rounded';
      } else {
        muteBtn.textContent = isMuted ? 'Unmute Audio' : 'Mute Audio';
        muteBtn.className = isMuted
          ? 'px-4 py-2 bg-red-600 text-white rounded text-sm'
          : 'px-4 py-2 bg-slate-700 text-white rounded text-sm';
      }

      muteBtn.setAttribute('aria-pressed', String(isMuted));
    }

    function setAudioMuted(muted) {
      isMuted = muted;

      if (isOwner && globalLocalStream) {
        globalLocalStream.getAudioTracks().forEach(track => {
          track.enabled = !isMuted;
        });
      } else if (!isOwner) {
        const remoteVideo = document.getElementById('remoteVideo');
        if (remoteVideo) remoteVideo.muted = isMuted;
      }

      updateMuteButton();
    }

    function toggleAudioMute() {
      if (isOwner && (!globalLocalStream || globalLocalStream.getAudioTracks().length === 0)) return;
      setAudioMuted(!isMuted);
    }

    updateMuteButton();

    if (isOwner) {
      const startBtn = document.getElementById('startBtn');
      const stopBtn = document.getElementById('stopBtn');
      const localVideo = document.getElementById('localVideo');

      startBtn.addEventListener('click', async () => {
        try {
          globalLocalStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          setAudioMuted(false);
          localVideo.srcObject = globalLocalStream;
          const announceBroadcaster = () => socket.emit('broadcaster', { room: username });
          if (socket.connected) {
            announceBroadcaster();
          } else {
            socket.once('connect', announceBroadcaster);
            socket.connect();
          }
          startBtn.classList.add('hidden');
          stopBtn.classList.remove('hidden');
        } catch (err) {
          alert('Could not get camera/microphone: ' + err.message);
        }
      });

      stopBtn.addEventListener('click', () => {
        if (globalLocalStream) {
          globalLocalStream.getTracks().forEach(t => t.stop());
          globalLocalStream = null;
        }
        setAudioMuted(false);
        Object.values(pcs).forEach(pc => pc.close());
        Object.keys(pcs).forEach(viewerId => delete pcs[viewerId]);
        socket.disconnect();
        stopBtn.classList.add('hidden');
        startBtn.classList.remove('hidden');
      });

      socket.on('watch', async (data) => {
        const viewerId = data.viewer;
        const pc = new RTCPeerConnection(configuration);
        pcs[viewerId] = pc;

        globalLocalStream.getTracks().forEach(track => pc.addTrack(track, globalLocalStream));

        pc.onicecandidate = e => {
          if (e.candidate) {
            socket.emit('candidate', { to: viewerId, candidate: e.candidate });
          }
        };

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        socket.emit('offer', { to: viewerId, sdp: pc.localDescription, from: socket.id });
      });

      socket.on('answer', async (data) => {
        const from = data.from;
        const sdp = data.sdp;
        const pc = pcs[from];
        if (!pc) return;
        await pc.setRemoteDescription(sdp);
      });

      socket.on('candidate', async (data) => {
        const from = data.from;
        const candidate = data.candidate;
        const pc = pcs[from];
        if (!pc) return;
        try {
          await pc.addIceCandidate(candidate);
        } catch (e) { console.error(e); }
      });

    } else {
      const remoteVideo = document.getElementById('remoteVideo');
      let pc = null;

      socket.on('connect', () => {
        socket.emit('watch', { room: username });
      });

      socket.on('offer', async (data) => {
        const sdp = data.sdp;
        const from = data.from; 
        pc = new RTCPeerConnection(configuration);
        pcs[from] = pc;

        pc.ontrack = e => {
          remoteVideo.srcObject = e.streams[0];
        };

        pc.onicecandidate = e => {
          if (e.candidate) {
            socket.emit('candidate', { to: from, candidate: e.candidate });
          }
        };

        await pc.setRemoteDescription(sdp);
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);

        socket.emit('answer', { to: data.from, sdp: pc.localDescription, from: socket.id });
      });

      socket.on('candidate', async (data) => {
        const candidate = data.candidate;
        if (!pc) return;
        try { await pc.addIceCandidate(candidate); } catch (e) { console.error(e); }
      });
    }
  </script>
  <script src="/static/js/gifts.js"></script>
</body>
</html>
