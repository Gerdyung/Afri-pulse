```html
{% extends "base.html" %}

{% block content %}
<div class="mx-auto max-w-md">
  <div class="rounded-3xl border border-slate-800 bg-slate-900/70 p-8 shadow-xl shadow-slate-900/20">

    <div class="text-center">
      <p class="text-sm uppercase tracking-[0.24em] text-cyan-400/80">Create Account</p>
      <h2 class="mt-3 text-3xl font-semibold text-white">Join Afri-Pulse</h2>
      <p class="mt-2 text-slate-400">Start sharing content with your fans today</p>
    </div>

    <form method="POST" class="mt-8 space-y-6">

      <!-- Email -->
      <div>
        <label for="email" class="block text-sm font-medium text-slate-300 mb-2">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          class="w-full rounded-2xl border border-slate-700 bg-slate-950/50 px-4 py-3 text-slate-100 placeholder-slate-500 focus:border-cyan-500 focus:outline-none"
          placeholder="you@example.com">
      </div>

      <!-- Username -->
      <div>
        <label for="username" class="block text-sm font-medium text-slate-300 mb-2">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          required
          class="w-full rounded-2xl border border-slate-700 bg-slate-950/50 px-4 py-3 text-slate-100 placeholder-slate-500 focus:border-cyan-500 focus:outline-none"
          placeholder="your_username">
      </div>

      <div>
        <label for="password" class="block text-sm text-slate-300 mb-2">Password</label>
        <div class="relative">
          <input
            type="password"
            id="password"
            name="password"
            required
            class="w-full rounded-2xl border border-slate-700 bg-slate-950/50 px-4 py-3 text-slate-100">
        </div>
      </div>

      <div>
        <label for="confirm_password" class="block text-sm text-slate-300 mb-2">Confirm Password</label>
        <div class="relative">
          <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            required
            class="w-full rounded-2xl border border-slate-700 bg-slate-950/50 px-4 py-3 text-slate-100">
        </div>
      </div>

      <div class="rounded-2xl border border-cyan-500/30 bg-cyan-500/5 p-4">
        <p class="mb-3 text-sm font-medium text-cyan-300">Paystack subscription setup</p>
        <div class="space-y-4">
          <div>
            <label for="business_name" class="block text-sm font-medium text-slate-300 mb-2">Business Name</label>
            <input type="text" id="business_name" name="business_name" class="w-full rounded-2xl border border-slate-700 bg-slate-950/50 px-4 py-3 text-slate-100 placeholder-slate-500 focus:border-cyan-500 focus:outline-none" placeholder="Afri Pulse Media">
          </div>

          <div class="grid gap-4 sm:grid-cols-2">
            <div>
              <label for="bank_code" class="block text-sm font-medium text-slate-300 mb-2">Bank Code</label>
              <input type="text" id="bank_code" name="bank_code" class="w-full rounded-2xl border border-slate-700 bg-slate-950/50 px-4 py-3 text-slate-100 placeholder-slate-500 focus:border-cyan-500 focus:outline-none" placeholder="058">
            </div>
            <div>
              <label for="account_number" class="block text-sm font-medium text-slate-300 mb-2">Account Number</label>
              <input type="text" id="account_number" name="account_number" class="w-full rounded-2xl border border-slate-700 bg-slate-950/50 px-4 py-3 text-slate-100 placeholder-slate-500 focus:border-cyan-500 focus:outline-none" placeholder="0123456789">
            </div>
          </div>

          <div class="grid gap-4 sm:grid-cols-2">
            <div>
              <label for="contact_name" class="block text-sm font-medium text-slate-300 mb-2">Contact Name</label>
              <input type="text" id="contact_name" name="contact_name" class="w-full rounded-2xl border border-slate-700 bg-slate-950/50 px-4 py-3 text-slate-100 placeholder-slate-500 focus:border-cyan-500 focus:outline-none" placeholder="Jane Doe">
            </div>
            <div>
              <label for="contact_phone" class="block text-sm font-medium text-slate-300 mb-2">Contact Phone</label>
              <input type="tel" id="contact_phone" name="contact_phone" class="w-full rounded-2xl border border-slate-700 bg-slate-950/50 px-4 py-3 text-slate-100 placeholder-slate-500 focus:border-cyan-500 focus:outline-none" placeholder="08012345678">
            </div>
          </div>
        </div>
      </div>

      <button
        type="submit"
        class="w-full rounded-full bg-cyan-500 px-6 py-3 text-sm font-semibold text-slate-950 transition hover:bg-cyan-400">
        Create Account
      </button>

    </form>

    <div class="mt-6 text-center">
      <p class="text-sm text-slate-400">
        Already have an account?
        <a href="{{ url_for('login') }}" class="text-cyan-400 hover:text-cyan-300">
          Sign in
        </a>
      </p>
    </div>

  </div>
</div>


{% endblock %}
```
