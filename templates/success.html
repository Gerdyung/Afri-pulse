{% extends 'base.html' %}
{% block title %}Payment Success · Afri-Pulse{% endblock %}
{% block content %}
<div class="mx-auto max-w-3xl rounded-3xl border border-slate-800 bg-slate-900/70 p-10 shadow-2xl shadow-slate-900/20">
  <div class="space-y-6 text-center">
    <div class="mx-auto flex h-20 w-20 items-center justify-center rounded-full bg-cyan-500/10 text-4xl text-cyan-300">✓</div>
    <h2 class="text-3xl font-semibold text-white">Payment successful</h2>
    <p class="text-slate-400">Thank you for subscribing. Your payment reference is <span class="font-semibold text-white">{{ reference }}</span>.</p>
    <div class="rounded-3xl bg-slate-950/80 p-6 text-left text-slate-300">
      <p><strong>Email:</strong> {{ email }}</p>
      <p class="mt-2"><strong>Amount:</strong> ₦{{ amount }}</p>
    </div>
    <a href="/" class="inline-flex items-center justify-center rounded-full bg-cyan-500 px-6 py-3 text-sm font-semibold text-slate-950 transition hover:bg-cyan-400">Back to home</a>
  </div>
</div>
{% endblock %}
