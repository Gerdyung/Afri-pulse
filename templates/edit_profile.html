{% extends 'base.html' %}
{% block title %}Edit Profile · Afri-Pulse{% endblock %}
{% block content %}
<div class="mx-auto max-w-3xl">
  <div class="rounded-3xl border border-slate-800 bg-slate-900/70 p-8 shadow-xl shadow-slate-900/20">
    <div class="mb-8">
      <p class="text-sm uppercase tracking-[0.24em] text-cyan-400/80">Edit Profile</p>
      <h2 class="mt-3 text-3xl font-semibold text-white">Customize your creator page</h2>
    </div>

    <!-- Added enctype="multipart/form-data" for file uploads -->
    <form method="POST" enctype="multipart/form-data" class="space-y-6">
      
      <!-- Profile Picture Upload Field -->
      <div class="flex items-center gap-6 pb-4 border-b border-slate-800">
        <img src="{{ url_for('uploaded_avatar', filename=current_user.avatar) if current_user.avatar and current_user.avatar != 'default_avatar.png' else 'https://ui-avatars.com/api/?name=' + current_user.username }}" 
             alt="Profile Picture" class="h-20 w-20 rounded-full object-cover border-2 border-cyan-500/50">
        <div class="flex-1">
          <label for="avatar" class="block text-sm font-medium text-slate-300 mb-2">Change Profile Picture</label>
          <input type="file" id="avatar" name="avatar" accept="image/*" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-cyan-500 file:text-slate-950 hover:file:bg-cyan-400">
        </div>
      </div>

      <div>
        <label for="display_name" class="block text-sm font-medium text-slate-300 mb-2">Display Name</label>
        <input type="text" id="display_name" name="display_name" value="{{ creator.display_name }}" required class="w-full rounded-2xl border border-slate-700 bg-slate-950/50 px-4 py-3 text-slate-100 placeholder-slate-500 focus:border-cyan-500 focus:outline-none">
      </div>

      <div>
        <label for="subtitle" class="block text-sm font-medium text-slate-300 mb-2">Subtitle</label>
        <input type="text" id="subtitle" name="subtitle" value="{{ creator.subtitle or '' }}" class="w-full rounded-2xl border border-slate-700 bg-slate-950/50 px-4 py-3 text-slate-100 placeholder-slate-500 focus:border-cyan-500 focus:outline-none">
      </div>

      <div>
        <label for="description" class="block text-sm font-medium text-slate-300 mb-2">Description</label>
        <textarea id="description" name="description" rows="4" class="w-full rounded-2xl border border-slate-700 bg-slate-950/50 px-4 py-3 text-slate-100 placeholder-slate-500 focus:border-cyan-500 focus:outline-none">{{ creator.description or '' }}</textarea>
      </div>

      <div>
        <label for="price" class="block text-sm font-medium text-slate-300 mb-2">Monthly Price (₦)</label>
        <input type="number" id="price" name="price" value="{{ creator.price }}" min="100" step="100" required class="w-full rounded-2xl border border-slate-700 bg-slate-950/50 px-4 py-3 text-slate-100 placeholder-slate-500 focus:border-cyan-500 focus:outline-none">
      </div>

      <div class="flex gap-3 pt-4">
        <button type="submit" class="flex-1 rounded-full bg-cyan-500 px-6 py-3 text-sm font-semibold text-slate-950 transition hover:bg-cyan-400">Save Changes</button>
        <a href="/dashboard" class="rounded-full border border-slate-700 px-6 py-3 text-sm font-semibold text-slate-200 transition hover:border-slate-500">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
